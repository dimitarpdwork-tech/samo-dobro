name: Daily editorial shortlist

on:
  schedule:
    # 13:17 UTC = 16:17 in Bulgaria during summer time.
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      shortlist_size:
        description: "How many strong candidates Claude should offer for your review"
        type: string
        default: "15"

permissions:
  contents: write
  issues: write

concurrency:
  group: dobrodelo-daily-shortlist
  cancel-in-progress: false

jobs:
  shortlist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ensure editorial label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create daily-candidates \
            --repo "${{ github.repository }}" \
            --description "Daily DobroDelo editorial shortlist" \
            --color "FFB703" \
            --force

      - name: Check for an unfinished shortlist
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          OPEN_NUMBER="$(gh issue list \
            --repo "${{ github.repository }}" \
            --label daily-candidates \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$OPEN_NUMBER" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "issue_number=$OPEN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "An editorial shortlist is still open: #$OPEN_NUMBER"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.existing.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.existing.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Build cheap candidate shortlist
        if: steps.existing.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          SIZE="${{ github.event.inputs.shortlist_size }}"
          if [ -z "$SIZE" ]; then SIZE="15"; fi
          python tools/prepare_candidate_issue.py --shortlist-size "$SIZE"

      - name: Make helper scripts executable
        if: steps.existing.outputs.skip != 'true'
        run: chmod +x tools/*.sh

      - name: Open editorial issue
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TITLE="📰 Добро Дело — избор на новини — $(date -u +'%Y-%m-%d')"

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --label daily-candidates \
            --body-file candidate_issue.md

      - name: Record dismissed candidates
        # Runs AFTER the issue exists, deliberately. prepare_candidate_issue.py
        # marks everything it did NOT shortlist as seen so rejected stories from
        # undated feeds don't come back for re-judging (and re-paying) tomorrow
        # — but if `gh issue create` had failed with this step already done, the
        # dismissed candidates would be burned with no shortlist to show for it.
        # Persisting last means a failed issue creation costs nothing.
        if: steps.existing.outputs.skip != 'true'
        run: tools/commit_seen.sh
