name: Facebook post queue

# Drains any Facebook posts deferred by facebook.max_per_run in config.json.
#
# Why this exists: publish.yml posts up to max_per_run after each merge, then
# commits the fb_posted flags. That commit was previously assumed to retrigger
# publish.yml and post the remainder — but pushes made with the default
# GITHUB_TOKEN deliberately do NOT trigger `on: push` workflows (GitHub blocks
# it to prevent runaway loops). So a merge of, say, 12 articles posted 5 and
# left 7 sitting until the *next* merge, which on a quiet week could be days.
#
# This runs on its own schedule and posts the next batch. It makes no commit
# when there is nothing left to post, so it is free and silent most of the time.

on:
  schedule:
    # Hourly, at :40. This has to be at least as frequent as
    # publishing_schedule.interval_minutes (60), or Facebook falls behind the
    # site: an article goes live at 18:15 and its post would wait for a drain
    # run hours later. Running hourly against an hourly stagger means each run
    # finds exactly the one article that just went live.
    #
    # The poster skips anything still embargoed (pipeline.is_live), so a
    # frequent cadence can never announce a page that does not exist yet.
    - cron: "40 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Same group name as the `facebook` job in publish.yml. Concurrency groups
  # are matched by name ACROSS workflows, so this is the shared lock that stops
  # a scheduled drain and a post-merge run from posting the same article twice.
  group: facebook-posting
  cancel-in-progress: false

jobs:
  post-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post any queued articles
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python pipeline.py --post-facebook

      - name: Commit Facebook bookkeeping
        run: |
          git config user.name "good-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles
          if ! git diff --cached --quiet; then
            git commit -m "Mark articles as posted to Facebook $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin main
            git push
          fi
