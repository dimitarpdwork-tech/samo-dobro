name: Publish scheduled articles

on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    outputs:
      due: ${{ steps.check.outputs.due }}

    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Is any scheduled article due?
        run: python3 tools/check_due.py

  publish:
    needs: check
    if: needs.check.outputs.due == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trigger Cloudflare rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit --allow-empty -m "Trigger Cloudflare scheduled publish"
          git push
